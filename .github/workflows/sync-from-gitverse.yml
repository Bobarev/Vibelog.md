name: Sync from GitVerse

on:
  schedule:
    - cron: '0 3 * * *'   # раз в день в 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pull from GitVerse and push
        run: |
          git remote add gitverse https://gitverse.ru/bobarev/Vibelog.md.git
          git fetch gitverse
          git pull --rebase origin master
          git merge --ff-only gitverse/master || echo "No changes or diverged"
          git push origin HEAD
