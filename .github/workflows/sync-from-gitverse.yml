name: Sync from GitVerse

on:
  schedule:
    - cron: '0 */6 * * *'   # каждые 6 часов
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write             # нужно для git push

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull from GitVerse and push
        run: |
          git remote add gitverse https://gitverse.ru/bobarev/Vibelog.md.git
          git fetch gitverse
          git merge --ff-only gitverse/master || echo "No changes or diverged"
          git push origin HEAD
