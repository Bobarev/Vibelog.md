<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 290" fill="none" aria-hidden="true">
  <!-- Логотип Vibelog (VL-345): глиф «документ с загнутым уголком».
       fill="currentColor" — иконка наследует цвет текста, поэтому отдельная
       версия для тёмной темы и dark:invert не нужны. -->
  <path fill="currentColor" d="M46 6h108l68 68v172c0 21-17 38-38 38H46c-21 0-38-17-38-38V44C8 23 25 6 46 6Z"/>
  <!-- Загнутый уголок: полупрозрачный, чтобы читался и на светлом, и на тёмном фоне -->
  <path fill="currentColor" opacity="0.35" d="M154 6l68 68h-46c-12 0-22-10-22-22V6Z"/>
  <!-- Строки «текста» внутри документа -->
  <path fill="currentColor" d="M52 118h124v20H52zM52 162h124v20H52zM52 206h84v20H52z"/>
</svg>
